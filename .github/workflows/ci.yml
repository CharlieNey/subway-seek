# Lint, typecheck, the tests, the timetable check and the web build, on every push to any
# branch and on pull requests. The balance simulations are slower: sims.yml.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Timetable freshness
        run: pnpm data:check
      - name: Build web
        run: pnpm --filter @stand-clear/web build
