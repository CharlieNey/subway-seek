# Deploy the game server to Fly.io (docs/DEPLOY-PLAN.md): run the checks, then `fly deploy`.
# A commit that fails lint, typecheck, the tests or the timetable check never deploys.
#
# Manual for now: Actions → Deploy server → Run workflow. It needs one repository secret,
# FLY_API_TOKEN (`fly tokens create deploy`, then `gh secret set FLY_API_TOKEN`). To deploy
# on every push to main that touches the server, uncomment the `push:` block.
name: Deploy server

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - apps/server/**
  #     - packages/engine/**
  #     - packages/data/**
  #     - infra/fly/**
  #     - pnpm-lock.yaml
  #     - .github/workflows/deploy-server.yml

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm data:check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy . --config infra/fly/fly.toml --dockerfile apps/server/Dockerfile
          --remote-only --ha=false
