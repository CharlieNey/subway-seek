<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Street View spike</title>
    <style>
      html, body { height: 100%; margin: 0; font: 13px system-ui, sans-serif; color: #1c1917; }
      body { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 1fr 300px; height: 100vh; }
      #pano { grid-row: 1 / 3; }
      #map { border-left: 1px solid #e7e5e4; }
      #side { border-left: 1px solid #e7e5e4; border-top: 1px solid #e7e5e4; padding: 10px 12px; overflow: auto; }
      button { font: 600 12px system-ui; padding: 4px 8px; margin: 0 4px 4px 0; border-radius: 6px; border: 1px solid #a8a29e; background: #fff; cursor: pointer; }
      button:disabled { opacity: .4; cursor: default; }
      table { border-collapse: collapse; width: 100%; margin-top: 6px; }
      td { padding: 2px 0; border-bottom: 1px solid #f5f5f4; }
      td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
      #log { margin-top: 6px; color: #57534e; white-space: pre-wrap; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="pano"></div>
    <div id="map"></div>
    <div id="side">
      <div><b>Street View spike</b> · <span id="zone"></span></div>
      <div style="margin-top: 6px">
        <button type="button" id="crawl" disabled>Map the zone</button>
        <button type="button" id="marker" disabled>Place hider marker</button>
        <button type="button" id="mode">Walk: jump</button>
      </div>
      <div style="color: #78716c">Click the small map to walk there (after mapping the zone).</div>
      <table id="metrics"></table>
      <div id="log"></div>
    </div>
    <script type="module" src="./streetview.ts"></script>
  </body>
</html>
