# The game server on one EC2 instance: the server container behind Caddy, which
# terminates TLS (Let's Encrypt, automatic) and proxies WebSockets straight through.
# Lives at /opt/stand-clear on the instance; `docker compose pull && docker compose up -d`
# is a deploy (infra/aws/deploy.sh, or the GitHub Action).
#
# Secrets and the host name come from /opt/stand-clear/.env (see .env.example).

services:
  server:
    image: ${IMAGE:?set IMAGE to the ECR image, e.g. 123.dkr.ecr.us-east-1.amazonaws.com/stand-clear-server:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8787"
      MATCH_LOG_DIR: /data/logs
      SESSION_DB: /data/sessions.sqlite
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
    volumes:
      # Match logs and live sessions, on the instance's EBS volume. Survives deploys.
      - data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SERVER_HOST: ${SERVER_HOST:?set SERVER_HOST to the server's domain, e.g. play-api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  data:
  caddy_data:
  caddy_config:
